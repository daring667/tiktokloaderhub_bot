name: Test and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - name: Run tests
        env:
          # tests/test_bot_start.py only checks these are set, not their
          # validity — dummy values are fine, no real secrets needed here.
          BOT_TOKEN: dummy
          API_KEY: dummy
          API_HASH: dummy
        run: python -m pytest tests/ -v

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, droid]
    steps:
      - name: Pull latest code
        run: |
          cd /home/droid/TiktokBot/TT
          git fetch origin master

          # `git reset --hard` below would silently discard any local edits to
          # tracked files on the server. Park them in a stash first so nothing
          # is ever lost without a trace — recover with `git stash list/pop`.
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            STASH_LABEL="ci-autostash-$(date -u +%Y%m%d-%H%M%S)"
            echo "::warning::Local changes found on the server; stashing them as $STASH_LABEL"
            git status --short --untracked-files=no
            git stash push -m "$STASH_LABEL"
          fi

          git reset --hard origin/master

      - name: Install dependencies
        run: |
          cd /home/droid/TiktokBot/TT
          ./venv/bin/pip install -q -r requirements.txt

      - name: Restart bot service
        run: sudo systemctl restart tiktokbot.service

      - name: Wait for startup
        run: sleep 5

      - name: Verify service is active
        run: sudo systemctl is-active tiktokbot.service

      - name: Verify the bot can actually download a video
        run: |
          cd /home/droid/TiktokBot/TT
          ./venv/bin/python healthcheck.py

      - name: Show recent logs on failure
        if: failure()
        run: sudo journalctl -u tiktokbot.service -n 50 --no-pager
